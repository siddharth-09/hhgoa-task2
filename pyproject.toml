[project]
name = "task2-ivr"
version = "0.1.0"
description = "Voice-enabled multilingual RAG over MSMARCO-XI"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyarrow>=18.0",
    "huggingface-hub>=0.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "hnswlib>=0.8",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "numpy>=2.0",
    "boto3>=1.35",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "orjson>=3.10",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3", "rich>=13.9"]

[tool.ruff]
line-length = 100
target-version = "py311"
